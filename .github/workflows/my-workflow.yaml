name: 03-Understanding Runners
on: push
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Runner Details
        run: |
          echo "Workflow is executing in Github Runners"
          echo "Github Runners Name is: $RUNNER_Name"
          echo "Github Runners OS is: $RUNNER_OS"
          echo "Github Runners Architecture is: $RUNNER_ARCH"
